{% extends "base.html" %}
{% block title %}404 - Page Not Found{% endblock %}
{% block content %}
<div style="max-width: 500px; margin: 4rem auto; text-align: center;">
  <div class="card">
    <div style="font-size: 3.5rem; margin-bottom: 0.5rem;">⚠️</div>
    <h2 style="margin-bottom: 0.5rem;">Page Not Found</h2>
    <p class="muted" style="margin-bottom: 1.5rem;">
      The incident or page you requested could not be located in our system.
    </p>
    <div style="display: flex; gap: 0.75rem; justify-content: center;">
      <a href="{{ url_for('index') }}" class="btn">Return to Home</a>
      <a href="{{ url_for('track_lookup') }}" class="btn outline-dark">Track Incident</a>
    </div>
  </div>
</div>
{% endblock %}
