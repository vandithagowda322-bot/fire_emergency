{% extends "base.html" %}
{% block title %}Dispatcher Login{% endblock %}
{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="card">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <div style="display: inline-flex; width: 52px; height: 52px; border-radius: 50%; background: var(--surface-alt); align-items: center; justify-content: center; font-size: 1.6rem; margin-bottom: 0.75rem;">
        🔐
      </div>
      <h2 style="margin-bottom: 0.35rem;">Dispatcher Portal</h2>
      <p class="muted" style="margin: 0; font-size: 0.92rem;">Authorized emergency response personnel only.</p>
    </div>

    <form method="post">
      <label>
        Username
        <input name="username" placeholder="Dispatcher username" autofocus required>
      </label>
      
      <label>
        Password
        <input type="password" name="password" placeholder="••••••••" required>
      </label>

      <button class="btn" type="submit" style="margin-top: 0.5rem; padding: 0.85rem; font-size: 1rem;">
        Sign In to Command Center →
      </button>
    </form>

    <div style="margin-top: 1.5rem; padding: 0.85rem; background: var(--surface-alt); border-radius: var(--radius-sm); font-size: 0.82rem; color: var(--text-muted); text-align: center;">
      Default Dispatcher credentials:<br>
      <strong>Username:</strong> <code>admin</code> &nbsp;|&nbsp; <strong>Password:</strong> <code>admin123</code>
    </div>
  </div>
</div>
{% endblock %}
