{% extends "base.html" %}
{% block title %}Track Incident Status{% endblock %}
{% block content %}
<div style="max-width: 520px; margin: 2.5rem auto;">
  <div class="card" style="text-align: center;">
    <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔍</div>
    <h2 style="margin-bottom: 0.5rem;">Track Incident Status</h2>
    <p class="muted" style="margin-bottom: 1.75rem;">
      Enter the incident tracking ID provided when your report was submitted.
    </p>
    
    <form method="post" style="display: flex; flex-direction: column; gap: 1rem; text-align: left;">
      <label>
        Incident Tracking ID #
        <input name="incident_id" placeholder="e.g. 1" inputmode="numeric" autofocus required style="font-size: 1.1rem; padding: 0.85rem 1rem;">
      </label>
      <button class="btn danger" type="submit" style="padding: 0.85rem; font-size: 1rem;">
        Check Live Status →
      </button>
    </form>

    <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); font-size: 0.88rem;" class="muted">
      Need to report a new fire incident? <a href="{{ url_for('report') }}" style="color: var(--primary); font-weight: 600;">Report here</a>
    </div>
  </div>
</div>
{% endblock %}
